<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgQuiz)" rx="12" />
  <rect x="50" y="40" width="500" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Question Progress -->
  <rect x="80" y="65" width="440" height="8" rx="4" fill="#0f172a" />
  <rect x="80" y="65" width="300" height="8" rx="4" fill="#6366f1" />
  
  <text x="80" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Q: Which data structure follows FIFO (First In First Out)?</text>
  
  <!-- Options -->
  <rect x="80" y="125" width="440" height="38" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="100" y="149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">A. Stack</text>
  
  <rect x="80" y="172" width="440" height="38" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <text x="100" y="196" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#818cf8">B. Queue (Selected)</text>
  
  <rect x="80" y="219" width="440" height="38" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="100" y="243" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">C. Binary Search Tree</text>
  
  <rect x="80" y="266" width="440" height="38" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">D. Graph</text>
</svg>
