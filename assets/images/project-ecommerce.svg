<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgEcom)" rx="12" />
  
  <!-- Browser Window Mockup -->
  <rect x="30" y="30" width="540" height="300" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <circle cx="55" cy="50" r="5" fill="#ef4444" />
  <circle cx="70" cy="50" r="5" fill="#f59e0b" />
  <circle cx="85" cy="50" r="5" fill="#10b981" />
  <rect x="110" y="44" width="200" height="12" rx="6" fill="#0f172a" />
  
  <!-- Content Area -->
  <rect x="50" y="80" width="160" height="230" rx="6" fill="#0f172a" stroke="#334155" />
  <rect x="65" y="95" width="130" height="90" rx="4" fill="url(#cardGrad)" opacity="0.8" />
  <rect x="65" y="200" width="100" height="12" rx="3" fill="#e2e8f0" />
  <rect x="65" y="220" width="60" height="10" rx="3" fill="#38bdf8" />
  <rect x="65" y="255" width="130" height="30" rx="4" fill="#2563eb" />
  
  <!-- Secondary Card -->
  <rect x="225" y="80" width="160" height="230" rx="6" fill="#0f172a" stroke="#334155" />
  <rect x="240" y="95" width="130" height="90" rx="4" fill="url(#cardGrad)" opacity="0.6" />
  <rect x="240" y="200" width="90" height="12" rx="3" fill="#e2e8f0" />
  <rect x="240" y="220" width="50" height="10" rx="3" fill="#38bdf8" />
  <rect x="240" y="255" width="130" height="30" rx="4" fill="#2563eb" />
  
  <!-- Cart Sidebar Mockup -->
  <rect x="400" y="80" width="150" height="230" rx="6" fill="#0f172a" stroke="#334155" />
  <rect x="415" y="95" width="80" height="12" rx="3" fill="#e2e8f0" />
  <line x1="415" y1="125" x2="535" y2="125" stroke="#334155" stroke-width="1" />
  <rect x="415" y="145" width="120" height="20" rx="3" fill="#1e293b" />
  <rect x="415" y="175" width="120" height="20" rx="3" fill="#1e293b" />
  <rect x="415" y="255" width="120" height="30" rx="4" fill="#10b981" />
