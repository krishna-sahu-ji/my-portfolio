<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgWeather)" rx="12" />
  
  <!-- Main Weather Card -->
  <rect x="50" y="40" width="500" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Search Bar Mockup -->
  <rect x="80" y="65" width="440" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="100" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">Search city (e.g. Lucknow, Delhi)...</text>
  
  <!-- Left: Big Temp & Icon -->
  <circle cx="150" cy="180" r="35" fill="url(#sunGrad)" />
  <path d="M140 185 a 20 20 0 0 1 35 -5 a 15 15 0 0 1 18 15 a 10 10 0 0 1 -5 10 l -48 0 z" fill="#e2e8f0" opacity="0.9" />
  <text x="210" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">28°C</text>
  <text x="212" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#38bdf8">Partly Cloudy • Uttar Pradesh</text>
  
  <!-- Right: 3 Metric Badges -->
  <rect x="370" y="130" width="150" height="42" rx="6" fill="#0f172a" />
  <text x="385" y="155" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Humidity: <tspan fill="#38bdf8" font-weight="bold">65%</tspan></text>
  
  <rect x="370" y="180" width="150" height="42" rx="6" fill="#0f172a" />
  <text x="385" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Wind: <tspan fill="#10b981" font-weight="bold">12 km/h</tspan></text>
  
  <rect x="370" y="230" width="150" height="42" rx="6" fill="#0f172a" />
  <text x="385" y="255" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Pressure: <tspan fill="#f59e0b" font-weight="bold">1012 hPa</tspan></text>
</svg>
